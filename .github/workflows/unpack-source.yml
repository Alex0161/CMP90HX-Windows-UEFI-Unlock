name: Unpack source archive

on:
  push:
    paths:
      - 'source/CMP90HX_source_only.zip'
      - '.github/workflows/unpack-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack and normalize source tree
        shell: bash
        run: |
          set -euxo pipefail
          test -f source/CMP90HX_source_only.zip

          rm -rf .unpack
          mkdir .unpack
          unzip -q source/CMP90HX_source_only.zip -d .unpack

          mkdir -p src include tools tests vendor patches docs

          cp .unpack/source/src_main.c src/main.c
          cp .unpack/source/src_elf_loader.c src/elf_loader.c

          cp .unpack/source/include_core_abi.h include/core_abi.h
          cp .unpack/source/include_elf64_min.h include/elf64_min.h
          cp .unpack/source/include_elf_loader.h include/elf_loader.h
          cp .unpack/source/include_uefi_min.h include/uefi_min.h

          cp .unpack/source/tools_verify_core.py tools/verify_core.py
          cp .unpack/source/tools_verify_efi.py tools/verify_efi.py
          cp .unpack/source/tests_test_elf_loader.c tests/test_elf_loader.c

          cp .unpack/source/Makefile Makefile
          cp .unpack/MANUAL_GPU4_MADE_IDENTICAL.patch patches/MANUAL_GPU4_MADE_IDENTICAL.patch
          cp .unpack/README_RU.txt docs/README_RU_LEGACY.txt

          cat > tools/fetch-core.sh <<'EOF'
          #!/usr/bin/env sh
          set -eu
          echo "nvpermissive-core.o is intentionally not auto-downloaded."
          echo "Place your legally obtained copy at vendor/nvpermissive-core.o"
          echo "Expected tested SHA-256:"
          echo "c9702b4887d397272f86dcc25eea2bb11a46d636c91311d7b71f2fb8b01951e5"
          exit 1
          EOF
          chmod +x tools/fetch-core.sh

          touch vendor/.gitkeep
          rm -f source/CMP90HX_source_only.zip
          rmdir source 2>/dev/null || true
          rm -rf .unpack

      - name: Commit normalized tree
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Unpack source tree into src include tools tests"
          git push
