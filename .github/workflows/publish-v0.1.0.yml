name: Publish v0.1.0

on:
  push:
    paths:
      - '.github/workflows/publish-v0.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists."
            exit 0
          fi
          gh release create v0.1.0 \
            --target main \
            --title "v0.1.0 — Manual 4-GPU verified build" \
            --notes-file RELEASE_NOTES_v0.1.0.md
